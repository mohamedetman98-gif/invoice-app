<script>
(async()=>{

/* التواريخ: تُحفظ دائماً بصيغة yyyy-mm-dd وتُعرض dd/mm/yyyy (تتعامل مع تاريخ Excel الرقمي والنصوص) */
function parseDate(x){if(x instanceof Date)return isNaN(x)?"":`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
if(typeof x==="number"||(typeof x==="string"&&/^\d{5}(\.\d+)?$/.test(x.trim()))){const n=Number(x);if(n>20000&&n<80000)return new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5).toISOString().slice(0,10)}
if(typeof x==="string"){const t=x.trim();let m=/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/.exec(t);if(m)return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(t);if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
return x==null?"":x}
function cz(x){if(x==null)return"";const t=String(x).trim();return/^0+(\.0+)?$/.test(t)?"":t}
function isoLocal(t){const d=new Date(t),q=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${q(d.getMonth()+1)}-${q(d.getDate())} ${q(d.getHours())}:${q(d.getMinutes())}`}
function fdate(v){const x=parseDate(v),m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(x);return m?`${m[3]}/${m[2]}/${m[1]}`:String(x??"")}

function shell(){const okTab={imp:can("import")||can("export")||can("replace"),lk:can("lookups"),bk:can("backup")||can("restore"),adm:user.role==="admin",set:user.role==="admin"};

<div class="tabs">${t.map(([k,n])=>`<button data-t="${k}" class="${k===tab?"on":""}">${n}</button>`).join("")}</div><div id="bn"></div><div id="main"></div>`;
lo.onclick=async()=>{try{await api("/api/logout",{})}catch(e){}if(es){es.close();es=null}wasConn=false;user=null;setConn(false);loginView()};pwb.onclick=()=>pwView(false);snd.onclick=()=>{SND=!SND;try{localStorage.setItem("snd",SND?"1":"0")}catch(e){}snd.textContent=SND?"🔔":"🔕";if(SND)beep("ok")};
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(b.dataset.t===tab)return;if(!O.dirty||confirm("تجاهل التعديلات غير المحفوظة؟")){O.dirty=false;showTab(b.dataset.t)}});showTab(tab)}

({ops:opsView,dash:dashView,drv:drvView,imp:impView,lk:lkView,bk:bkView,adm:admView,set:setView})[t]();if(t==="lk")m.classList.add("two");if(t==="imp")m.classList.add("imp");if(t==="bk")m.classList.add("bk");if(t==="set")m.classList.add("set");banner()}

b.innerHTML=sw+`<div class="card" style="border-color:var(--bad)"><b class="bad">⚠ تنبيه للمدير:</b> ${u.w.length?`أكواد مخازن غير مضافة (${u.w.length}): <b>${u.w.map(esc).join("، ")}</b>. `:""}${u.d.length?`سائقون غير مضافين (${u.d.length}): <b>${u.d.map(esc).join("، ")}</b>. `:""}<button id="gl">إضافتها الآن</button></div>`;

function combo(host,o){host.classList.add("combo");host.innerHTML=`<input class="cb-in" autocomplete="off" placeholder="${esc(o.ph||"اكتب للبحث أو اختر")}"><span class="cb-x" hidden>✕</span><div class="cb-list" hidden></div>`;
const inp=host.querySelector("input"),lst=host.querySelector(".cb-list"),x=host.querySelector(".cb-x");let items=[],hl=-1;const MAX=400;
const lab=v=>{if(v===""||v==null)return"";const it=o.items().find(i=>i.v===v);return it?it.t:String(v)};

items=[...(o.all&&!typed?[{v:"",t:o.all}]:[]),...f.slice(0,MAX)];hl=items.length?(o.all&&!typed&&items.length>1&&o.val()?1:0):-1;
lst.innerHTML=items.map((i,k)=>`<div class="cb-it ${k===hl?"hl":""}" data-k="${k}">${esc(i.t)}</div>`).join("")+(f.length>MAX?`<div class="cb-more">يعرض أول ${MAX} نتيجة — أكمل الكتابة للتصفية</div>`:"")+(typed&&!f.length?'<div class="cb-more">لا توجد نتائج</div>':"");lst.hidden=false};

const render=()=>{const t=kk(inp.value),all=o.items(),cur=new Set(sel()),f=t?all.filter(i=>kk(i.t).includes(t)):all;items=f.slice(0,400);hl=items.length?0:-1;
lst.innerHTML=(sel().length?'<div class="cb-it cb-clear" data-k="-1">✕ مسح كل الاختيارات</div>':"")+items.map((i,k)=>`<div class="cb-it ${k===hl?"hl":""}" data-k="${k}"><span class="cb-box">${cur.has(i.v)?"☑":"☐"}</span>${esc(i.t)}</div>`).join("")+(!items.length?'<div class="cb-more">لا توجد نتائج</div>':"");lst.hidden=false};
const toggle=k=>{if(k===-1)o.set([]);else{const it=items[k];if(!it)return;const a=sel().slice(),i=a.indexOf(it.v);if(i>=0)a.splice(i,1);else a.push(it.v);o.set(a)}chipsR();render();inp.focus()};
inp.onfocus=render;inp.oninput=render;
inp.onkeydown=e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!items.length)return;hl=(hl+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;lst.querySelectorAll(".cb-it:not(.cb-clear)").forEach((d,k)=>{d.classList.toggle("hl",k===hl);if(k===hl)d.scrollIntoView({block:"nearest"})})}
else if(e.key==="Enter"){e.preventDefault();if(hl>=0)toggle(hl)}else if(e.key==="Escape"){lst.hidden=true;inp.blur()}else if(e.key==="Backspace"&&!inp.value&&sel().length){o.set(sel().slice(0,-1));chipsR();render()}};

const nat=(x,y)=>collEn.compare(String(x),String(y));

function searchInvoice(){const t=kk(O.qi);O.mode="inv";O.msg="";O.auto="";

const cur=new Map(lkList(k).map(x=>[kk(x[c.f[0]]),x])),seen=new Set(),add=[],upd=[],empty=[];let same=0,dup=0;
rows.forEach(r=>{const key=String(r[kh]??"").trim(),val=String(r[vh]??"").trim();if(!key)return;const id=kk(key);if(seen.has(id)){dup++;return}seen.add(id);

if(gone.length)h+=`<p><label><input type="checkbox" id="lkdel"> حذف السجلات غير الموجودة في الملف (${gone.length}) <span class="note">— ستظهر فواتيرها كغير مضافة</span></label></p>`;
h+=`<div class="row"><button class="p" id="lkok" ${add.length||upd.length||gone.length?"":"disabled"}>تأكيد التطبيق</button></div>`;res.innerHTML=h;
document.getElementById("lkok").onclick=()=>{const del=document.getElementById("lkdel")&&document.getElementById("lkdel").checked;
let list=lkList(k).map(x=>({...x}));upd.forEach(u=>{list.find(x=>kk(x[c.f[0]])===kk(u.ex[c.f[0]]))[c.sel]=u.val});list.push(...add);

LKMSG=`تم التطبيق: إضافة ${add.length} وتعديل ${upd.length}${del?" وحذف "+gone.length:""}.`;setLk(k,list)}
}catch(e){res.innerHTML='<p class="bad">فشل قراءة الملف: '+esc(e.message)+"</p>"}}

const sn=document.getElementById("syncnow");if(sn)sn.onclick=async()=>{sn.disabled=true;try{await api("/api/sync-now",{});toast("تم الرفع ✔");loadSync()}catch(e){alert(e.message);sn.disabled=false}}}catch(e){box.textContent=e.message}}
function setView(){LW={dash:getLayout("dash"),facts:getLayout("facts"),drv:getLayout("drv")};const sd=CFG.sound||{};
const tsel=k=>`<select id="snd_${k}">${Object.entries(TONES[k]).map(([id,t])=>`<option value="${id}" ${(sd[k]||"p1")===id?"selected":""}>${t[0]}</option>`).join("")}</select>`;
main.innerHTML=`<div class="card"><div class="row" style="margin:0"><b>⚙️ إعدادات النظام (للمدير)</b><span class="note">تنطبق على كل المستخدمين</span><span style="margin-inline-start:auto"></span><button class="p" id="stsave">💾 حفظ كل الإعدادات</button><button id="strest">↺ استعادة الإعدادات الافتراضية</button></div></div>
<div class="col"><div class="card grow"><b>✏️ أسماء الشاشات والمصطلحات</b><p class="note">اكتب الاسم الجديد، واتركه فارغاً للعودة للاسم الافتراضي.</p><div class="tw"><table>${TERM_GROUPS.map(([g,keys])=>`<tr><th colspan="2">${g}</th></tr>`+keys.map(k=>`<tr><td class="note">${esc(DEF_TERMS[k])}</td><td><input data-term="${k}" value="${esc((CFG.terms&&CFG.terms[k])||"")}" placeholder="${esc(DEF_TERMS[k])}" style="width:100%"></td></tr>`).join("")).join("")}</table></div></div></div>
<div class="col"><div class="card"><b>🔔 نغمات التنبيه</b><div class="grid" style="margin-top:6px"><label>نغمة الحفظ والنجاح<div class="row" style="margin:0">${tsel("ok")}<button id="tst_ok">🔊 تجربة</button></div></label><label>نغمة «لا توجد بيانات» والأخطاء<div class="row" style="margin:0">${tsel("err")}<button id="tst_err">🔊 تجربة</button></div></label>
<label>مستوى الصوت<input type="range" id="snd_vol" min="0.05" max="0.5" step="0.05" value="${sd.vol||.18}"></label></div></div>
<div class="card grow"><b>🧩 ترتيب وإظهار العناصر</b><p class="note">▲ ▼ لتحريك العنصر، والمربع لإظهاره أو إخفائه (يسري بعد الحفظ).</p><div class="laygrid"><div><b>فلاتر التقارير</b><div id="lay_dash"></div></div><div><b>بيانات الفاتورة (البحث والتحديث)</b><div id="lay_facts"></div></div><div><b>أعمدة متابعة السائقين</b><div id="lay_drv"></div></div></div></div>
<div class="card" id="synccard"><b>☁️ حالة الحفظ الخارجي والتخزين</b><div id="syncbody" class="note">جارٍ التحقق...</div></div><div class="card"><b>🛠 صيانة البيانات</b><p class="note">إذا ظهرت فواتير مستلمة بتاريخ اليوم بسبب استيراد قديم، يمكنك مسح تواريخ الاستلام المسجّلة (تُحفظ نسخة احتياطية قبلها). ستظهر الفواتير بتاريخ استلام عند تعديلها من شاشتي البحث والتحديث أو متابعة السائقين.</p><button id="clrrec">مسح تواريخ الاستلام المسجّلة لكل الفواتير</button></div></div>`;
drawLay();loadSync();
const prev=k=>{const o=CFG.sound,s0=SND;CFG.sound={ok:snd_ok.value,err:snd_err.value,vol:+snd_vol.value};SND=true;beep(k);SND=s0;CFG.sound=o};tst_ok.onclick=()=>prev("ok");tst_err.onclick=()=>prev("err");
stsave.onclick=async()=>{const terms={};document.querySelectorAll("[data-term]").forEach(i=>{const v=i.value.trim();if(v&&v!==DEF_TERMS[i.dataset.term])terms[i.dataset.term]=v});
const layout={};for(const n of["dash","facts","drv"])layout[n]=LW[n].map(x=>({k:x.k,on:x.on}));
try{await saveCfg({terms,sound:{ok:snd_ok.value,err:snd_err.value,vol:+snd_vol.value},layout});toast("تم حفظ الإعدادات ✔");shell()}catch(e){alert(e.message)}};
strest.onclick=async()=>{if(confirm("استعادة كل الإعدادات (الأسماء والنغمات والترتيب) للوضع الافتراضي؟"))try{await saveCfg({});toast("تمت استعادة الإعدادات الافتراضية");shell()}catch(e){alert(e.message)}};
clrrec.onclick=async()=>{if(!confirm("مسح تواريخ الاستلام المسجّلة لكل الفواتير؟ (تُحفظ نسخة احتياطية قبلها)"))return;try{await clearReceived();toast("تم مسح تواريخ الاستلام");}catch(e){alert(e.message)}}}
async function clearReceived(){await api("/api/maintenance/clear-received",{});await loadState();onRemote()}
function permCard(x){const isA=x.role==="admin";return`<div class="card" style="border:2px solid var(--pri)"><b>صلاحيات المستخدم: ${esc(x.u)}</b> <span class="note">(الدور: ${RN[x.role]})</span>
${isA?'<p class="note">المدير لديه كل الصلاحيات ولا يمكن تقييدها.</p>':`<p class="note">يمكنك منح هذا المستخدم صلاحية إضافية أو منعه من صلاحية يملكها دوره، دون التأثير على بقية المستخدمين بنفس الدور.</p><div class="tw"><table><tr><th>الصلاحية</th><th>حسب الدور</th><th>تخصيص لهذا المستخدم</th><th>الفعلية</th></tr>
${Object.entries(PERMS).map(([k,l])=>{const def=!!(ROLE_DEF[x.role]||{})[k],o=x.pm&&x.pm[k];return`<tr><td>${l}</td><td>${def?"✔":"✘"}</td><td><select data-pm="${k}"><option value="">حسب الدور</option><option value="1" ${o===true?"selected":""}>مسموح</option><option value="0" ${o===false?"selected":""}>ممنوع</option></select></td><td>${can(k,x)?'<span class="ok">✔</span>':'<span class="bad">✘</span>'}</td></tr>`}).join("")}</table></div>
<div class="row" style="margin-top:8px"><button class="p" id="pmsave">حفظ الصلاحيات</button><button id="pmclose">إغلاق</button></div>`}</div>`}
async function userCall(m,u,b){try{await api("/api/users"+(u?"/"+encodeURIComponent(u):""),b,m);const j=await api("/api/users");users=j.users;admView()}catch(e){alert(e.message);admView()}}
function admView(){main.innerHTML=`<div class="card grow"><div class="tw"><table id="au"><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>صلاحيات خاصة</th><th></th></tr>
${users.map((x,i)=>`<tr><td>${esc(x.u)}</td><td><select data-r="${i}">${Object.keys(RN).map(r=>`<option value="${r}" ${r===x.role?"selected":""}>${RN[r]}</option>`).join("")}</select></td><td>${x.active?"نشط":"مجمّد"}</td><td>${x.role==="admin"?"كل الصلاحيات":(Object.keys(x.pm||{}).length||"—")}</td>
<td><button data-a="e${i}">الصلاحيات</button> <button data-a="t${i}">تجميد/تفعيل</button> <button data-a="p${i}">إعادة تعيين كلمة المرور</button> <button data-a="d${i}">حذف</button></td></tr>`).join("")}</table></div></div>
${PE!==null&&users[PE]?permCard(users[PE]):""}<div class="card"><b>مستخدم جديد</b><div class="row" style="margin-top:8px"><input id="nu" placeholder="اسم المستخدم"><input id="np" placeholder="كلمة مرور مؤقتة (6 أحرف على الأقل)"><select id="nr">${Object.keys(RN).map(r=>`<option value="${r}">${RN[r]}</option>`).join("")}</select><button class="p" id="na">إضافة</button></div><p class="note">يُطلب من المستخدم تغيير كلمة المرور المؤقتة عند أول دخول.</p>
<p><button id="rs">حذف كل الفواتير (بدء بيانات فارغة)</button></p></div>`;
document.querySelectorAll("[data-r]").forEach(s=>s.onchange=()=>userCall("PUT",users[+s.dataset.r].u,{role:s.value}));
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const c=b.dataset.a[0],i=+b.dataset.a.slice(1),x=users[i];
if(c==="e"){PE=i;admView();return}
if(c==="t")return userCall("PUT",x.u,{active:!x.active});
if(c==="p"){const p=prompt("كلمة مرور مؤقتة جديدة لـ "+x.u+" (6 أحرف على الأقل)");if(p)return userCall("PUT",x.u,{password:p});return}
if(x.u===user.u)return alert("لا يمكنك حذف حسابك الحالي");if(confirm("حذف "+x.u+"؟")){PE=null;userCall("DELETE",x.u)}});
if(document.getElementById("pmsave")){pmsave.onclick=()=>{const x=users[PE],pm={};document.querySelectorAll("[data-pm]").forEach(el=>{const k=el.dataset.pm,def=!!(ROLE_DEF[x.role]||{})[k];if(el.value==="1"&&!def)pm[k]=true;else if(el.value==="0"&&def)pm[k]=false});PE=null;userCall("PUT",x.u,{pm})};pmclose.onclick=()=>{PE=null;admView()}}
na.onclick=()=>{const u=nu.value.trim();if(!u||!np.value)return alert("أكمل البيانات");userCall("POST",null,{username:u,password:np.value,role:nr.value})};
rs.onclick=async()=>{if(!confirm("سيتم حذف كل الفواتير (يبقى المستخدمون وجداول المخازن والسائقين). تُحفظ نسخة احتياطية قبل الحذف. متابعة؟"))return;if(prompt("للتأكيد اكتب كلمة: حذف")!=="حذف")return;
try{await api("/api/invoices/delete-all",{confirm:"حذف"});await loadState();O=newO();banner();alert("تم حذف كل الفواتير")}catch(e){alert(e.message)}}}
applyCfg();document.getElementById("ftr").innerHTML=`© ${new Date().getFullYear()} محمد صبري — جميع الحقوق محفوظة &nbsp;|&nbsp; فكرة وتنفيذ: محمد صبري`;
window.__dbg=()=>({invs,users,WH,DR,user,conn});
(async()=>{try{const j=await api("/api/me");user=j.me;if(user.mustChange)pwView(true,null);else await enter()}catch(e){loginView()}})();
})();
</script></body></html>
